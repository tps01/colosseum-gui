name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v7
        with:
          path: colosseum-gui
      - uses: actions/checkout@v7
        with:
          repository: tps01/colosseum-core
          ref: develop
          path: colosseum-core
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install package
        working-directory: colosseum-gui
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ../colosseum-core
          python -m pip install -e .
          python -m pip check
      - name: Smoke test installed runtime
        working-directory: colosseum-gui
        shell: bash
        run: |
          python -I -c "import colosseum_gui, playwright, mss; print(colosseum_gui.__version__)"
          if [ "${{ runner.os }}" = "Windows" ]; then
            python -I -c "from importlib import resources; from pathlib import Path; p=Path(resources.files('colosseum_gui')).joinpath('vendor','flaui','FlaUI.Core.dll'); assert p.is_file(), p"
          fi
      - name: Test
        working-directory: colosseum-gui
        run: python -m pytest -q

  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          path: colosseum-gui
      - uses: actions/checkout@v7
        with:
          repository: tps01/colosseum-core
          ref: develop
          path: colosseum-core
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install package and tools
        working-directory: colosseum-gui
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ../colosseum-core
          python -m pip install -e .
      - name: Lint
        working-directory: colosseum-gui
        run: ruff check colosseum_gui tests examples
      - name: Type check
        working-directory: colosseum-gui
        run: mypy
