[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "colosseum-gui"
version = "0.4.7"
description = "Colosseum product UI automation plugin (web and desktop)"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
  "colosseum-core>=0.18,<0.19",
  "playwright>=1.40,<2",
  "pythonnet>=3.0,<4; sys_platform == 'win32'",
  "python-xlib>=0.33,<1; sys_platform == 'linux'",
  "mss>=9.0,<11",
  "pillow>=10,<12; python_version < '3.14'",
  "pillow>=12,<14; python_version >= '3.14'",
]

[project.entry-points."colosseum.plugins"]
gui = "colosseum_gui:register"

[tool.setuptools.packages.find]
include = ["colosseum_gui*"]

[tool.setuptools.package-data]
colosseum_gui = ["py.typed", "vendor/flaui/*.dll", "vendor/flaui/FlaUI-LICENSE.txt"]

[tool.pytest.ini_options]
testpaths = ["tests/unit"]
pythonpath = ["."]

[tool.black]
line-length = 120
target-version = ["py39"]

[tool.ruff]
target-version = "py39"
line-length = 120
src = ["colosseum_gui"]

[tool.ruff.lint]
preview = true
explicit-preview-rules = true
select = ["A", "BLE", "FBT", "N", "COM", "C4", "C901", "ISC", "ICN", "TID", "TCH", "E", "F", "W", "I", "B", "UP", "ANN", "ARG", "SIM", "RET", "PTH", "PLR1702", "PLR0914", "PLR0915", "PLR0912"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ANN", "ARG", "C901", "PLR0912", "PLR0914", "PLR0915", "PLR1702"]
"examples/**" = ["ANN", "ARG", "C901", "PLR0912", "PLR0914", "PLR0915", "PLR1702"]
"scripts/**" = ["C901", "PLR0912", "PLR0914", "PLR0915", "PLR1702"]
"colosseum_gui/**" = ["A002"]

[tool.mypy]
python_version = "3.12"
packages = ["colosseum_gui"]
exclude = ["tests/", "build/", "examples/"]
strict = true
warn_unused_ignores = true
show_error_codes = true

[[tool.mypy.overrides]]
module = [
  "colosseum",
  "colosseum.*",
  "playwright",
  "playwright.*",
  "clr",
  "pythonnet",
  "pythonnet.*",
  "System",
  "System.*",
  "FlaUI.*",
  "Xlib",
  "Xlib.*",
  "mss",
  "mss.*",
  "PIL",
  "PIL.*",
]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = [
  "colosseum_gui.backends.desktop._flaui_bridge",
  "colosseum_gui.backends.desktop.flaui_driver",
]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = [
  "colosseum_gui.api.web",
  "colosseum_gui.api.desktop",
]
disallow_untyped_decorators = false
