[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "colosseum-gui"
version = "0.1.3"
description = "Colosseum product UI automation plugin (web and desktop)"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
  "colosseum-core>=0.15,<0.16",
  "playwright>=1.40,<2",
  "pywinauto>=0.6.8,<0.7; sys_platform == 'win32'",
  "python-xlib>=0.33,<1; sys_platform == 'linux'",
  "mss>=9.0,<11",
  "pillow>=10,<12",
  "pytest>=8.0",
  "mypy>=1.11",
  "ruff>=0.8",
]

[project.entry-points."colosseum.plugins"]
gui = "colosseum_gui:register"

[tool.setuptools.packages.find]
include = ["colosseum_gui*"]

[tool.setuptools.package-data]
colosseum_gui = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests/unit"]
pythonpath = ["."]

[tool.ruff]
target-version = "py39"
line-length = 100
src = ["colosseum_gui"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "ANN", "ARG", "SIM", "RET", "PTH"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ANN", "ARG"]
"examples/**" = ["ANN", "ARG"]

[tool.mypy]
python_version = "3.12"
packages = ["colosseum_gui"]
exclude = ["tests/", "build/", "examples/"]
strict = true
warn_unused_ignores = true
show_error_codes = true

[[tool.mypy.overrides]]
module = [
  "colosseum",
  "colosseum.*",
  "playwright",
  "playwright.*",
  "pywinauto",
  "pywinauto.*",
  "Xlib",
  "Xlib.*",
  "mss",
  "mss.*",
  "PIL",
  "PIL.*",
]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = [
  "colosseum_gui.api.web",
  "colosseum_gui.api.desktop",
]
disallow_untyped_decorators = false
